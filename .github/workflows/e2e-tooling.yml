name: E2E tooling

on:
  pull_request:
    branches: [master]
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e-tooling.yml'
  push:
    branches: [master, 'mergify/merge-queue/**']
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e-tooling.yml'

permissions:
  contents: read

jobs:
  tooling:
    name: E2E dependency and tooling checks
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record runtime versions
        run: |
          node --version
          npm --version
      - name: Install the exact lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check dependency resolution
        run: npm ls --all
      - name: Load the WebdriverIO CLI without starting a session
        run: node node_modules/@wdio/cli/bin/wdio.js --help
      - name: Transpile and discover specs without running desktop tests
        run: node scripts/check-tooling.mjs
      - name: Confirm validation did not rewrite dependency inputs
        run: git diff --exit-code -- package.json package-lock.json
